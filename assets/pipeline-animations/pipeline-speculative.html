<title>Voice Pipeline — Speculative Execution</title>
<style>
  :root{
    color-scheme: light;
    --bg: #fdfdfd;
    --grid: #dfe7e4;
    --fg: #1c2b28;
    --fg-dim: #5b726d;
    --audio-in: #0f9c86;
    --audio-silent: #d3ddd9;
    --vad-soft: #0aa39a;
    --llm: #6b46c1;
    --discard: #c0392b;
    --commit: #16a34a;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "Roboto Mono", monospace;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:var(--fg);
    font-family:var(--mono);
    padding:40px 20px;
  }

  .wrap{ width:100%; max-width:920px; display:flex; flex-direction:column; gap:20px; }

  .eyebrow{
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--fg-dim); text-align:center; margin:0;
  }

  .controls{ display:flex; align-items:center; gap:18px; justify-content:center; }
  .nav-btn{
    font-family:var(--mono); font-size:20px; line-height:1;
    background:transparent; color:var(--fg); border:1px solid var(--grid);
    border-radius:8px; width:40px; height:40px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .2s, color .2s;
  }
  .nav-btn:hover{ border-color:var(--audio-in); color:var(--audio-in); }
  .nav-btn:focus-visible{ outline:2px solid var(--audio-in); outline-offset:2px; }

  .headline-block{ text-align:center; max-width:640px; }
  #headline{ margin:0 0 6px; font-size:21px; font-weight:600; line-height:1.3; min-height:2.6em; display:flex; align-items:center; justify-content:center; text-wrap:balance; }
  #subtext{ margin:0; font-size:14px; color:var(--fg-dim); line-height:1.5; min-height:3em; }

  .dots{ display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
  .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--grid); border:none; cursor:pointer; padding:0;
    transition:background .2s, transform .2s;
  }
  .dot:hover{ transform:scale(1.3); }
  .dot.on{ background:var(--audio-in); }

  figure{ margin:0; }
  svg{ width:100%; height:auto; display:block; }
  text{ font-family:var(--mono); }

  figcaption{ margin-top:16px; text-align:center; font-size:15px; color:var(--fg-dim); }

  .lane-label{ font-size:12px; letter-spacing:.1em; fill:var(--fg-dim); }
  .tag-label{ font-size:10px; letter-spacing:.06em; fill:var(--fg-dim); }

  .reveal{ opacity:0; transform:translateY(6px); transition:opacity .5s ease, transform .5s ease; }
  .reveal.active{ opacity:1; transform:translateY(0); }
  .bar.reveal{ transition:opacity .4s ease; transform:none; }

  .in-bar{ fill:var(--audio-in); }
  .silent-bar{ fill:var(--audio-silent); }
  .stt-tick{ fill:var(--fg-dim); }
  .out-bar{ fill:var(--llm); }

  .vad-marker{ stroke:var(--vad-soft); }
  .vad-marker.reveal.active{ filter:drop-shadow(0 1px 2px rgba(10,163,154,.35)); }

  .grace-band{ fill:var(--llm); opacity:.18; }
  .grace-band.full{ opacity:.28; }

  .discard-mark{ stroke:var(--discard); stroke-width:2.5; stroke-linecap:round; }

  .reply-chip{
    fill:rgba(107,70,193,.07); stroke:var(--llm); stroke-width:2; stroke-dasharray:5 4;
    transition:stroke .5s ease, fill .5s ease, filter .5s ease, opacity .5s ease;
  }
  .reply-chip.committed{ stroke-dasharray:0; fill:rgba(107,70,193,.14); filter:drop-shadow(0 1px 3px rgba(22,163,74,.4)); }
  .reply-chip.discarded{ stroke:var(--discard); opacity:.45; }
  .reply-text{ fill:var(--fg); font-size:15px; }
  .reply-text-2{ fill:var(--llm); }

  .strike{ stroke:var(--discard); stroke-width:2; }

  .pulse-dot{ transform-box:fill-box; transform-origin:center; }
  @keyframes gentlePulse{
    0%,100%{ transform:scale(1); opacity:.6; }
    50%{ transform:scale(1.4); opacity:1; }
  }
  .pulse-dot.active{ animation:gentlePulse 1.1s ease-in-out 2; }

  @media (prefers-reduced-motion: reduce){
    .reveal{ transition:none; }
    .pulse-dot.active{ animation:none; }
  }
</style>

<div class="wrap">
  <p class="eyebrow">voice pipeline · speculative execution</p>

  <div class="controls">
    <button class="nav-btn" id="prev" aria-label="Previous step">‹</button>
    <div class="headline-block">
      <h2 id="headline"></h2>
      <p id="subtext"></p>
    </div>
    <button class="nav-btn" id="next" aria-label="Next step">›</button>
  </div>

  <div class="dots" id="dots"></div>

  <figure>
    <svg viewBox="0 0 900 480" role="img" aria-label="Diagram of a speculative voice pipeline: speech-to-text continuously re-transcribes every half second regardless of pauses; a very short silence fires a speculative reply immediately; if speech resumes within a longer grace window the speculative reply is discarded while transcription keeps going; only once the full grace window elapses uninterrupted does the reply commit and get spoken.">

      <text x="70" y="30" class="lane-label" fill="var(--fg-dim)">YOU</text>
      <text x="830" y="30" class="lane-label" text-anchor="end" fill="var(--fg-dim)">ASSISTANT</text>

      <!-- LANE 1: audio in -->
      <text x="70" y="58" class="lane-label">AUDIO IN</text>
      <line x1="55" y1="110" x2="845" y2="110" stroke="var(--grid)" stroke-width="1"/>

      <g id="seg-a">
        <rect class="bar reveal in-bar" data-step="1" x="70"  y="100" width="10" height="20" rx="3"/>
        <rect class="bar reveal in-bar" data-step="1" x="90"  y="92"  width="10" height="36" rx="3"/>
        <rect class="bar reveal in-bar" data-step="1" x="110" y="84"  width="10" height="52" rx="3"/>
        <rect class="bar reveal in-bar" data-step="1" x="130" y="96"  width="10" height="28" rx="3"/>
        <rect class="bar reveal in-bar" data-step="1" x="150" y="80"  width="10" height="60" rx="3"/>
        <rect class="bar reveal in-bar" data-step="1" x="170" y="88"  width="10" height="44" rx="3"/>
        <rect class="bar reveal in-bar" data-step="1" x="190" y="94"  width="10" height="32" rx="3"/>
        <rect class="bar reveal in-bar" data-step="1" x="210" y="76"  width="10" height="68" rx="3"/>
        <rect class="bar reveal in-bar" data-step="1" x="230" y="90"  width="10" height="40" rx="3"/>
        <rect class="bar reveal in-bar" data-step="1" x="250" y="98"  width="10" height="24" rx="3"/>
      </g>

      <circle class="stt-tick reveal" data-step="1" style="transition-delay:0s"   cx="110" cy="95" r="3"/>
      <circle class="stt-tick reveal" data-step="1" style="transition-delay:.25s" cx="190" cy="95" r="3"/>

      <g id="pause-1">
        <rect class="bar reveal silent-bar" data-step="2" x="262" y="107" width="8" height="6" rx="2"/>
        <rect class="bar reveal silent-bar" data-step="2" x="276" y="107" width="8" height="6" rx="2"/>
      </g>

      <line class="vad-marker reveal" data-step="2" x1="290" y1="80" x2="290" y2="140" stroke-width="4" stroke-linecap="round"/>
      <text class="tag-label reveal" data-step="2" x="298" y="112">VAD · 32ms</text>

      <rect class="grace-band reveal" data-step="3" x="290" y="150" width="50" height="14" rx="7"/>

      <g id="discard-x">
        <line class="discard-mark reveal" data-step="4" x1="334" y1="151" x2="346" y2="163"/>
        <line class="discard-mark reveal" data-step="4" x1="346" y1="151" x2="334" y2="163"/>
      </g>

      <g id="seg-b">
        <rect class="bar reveal in-bar" data-step="4" x="340" y="98" width="10" height="24" rx="3"/>
        <rect class="bar reveal in-bar" data-step="4" x="358" y="86" width="10" height="48" rx="3"/>
        <rect class="bar reveal in-bar" data-step="4" x="376" y="78" width="10" height="64" rx="3"/>
        <rect class="bar reveal in-bar" data-step="4" x="394" y="92" width="10" height="36" rx="3"/>
        <rect class="bar reveal in-bar" data-step="4" x="412" y="84" width="10" height="52" rx="3"/>
        <rect class="bar reveal in-bar" data-step="4" x="430" y="96" width="10" height="28" rx="3"/>
        <rect class="bar reveal in-bar" data-step="4" x="448" y="90" width="10" height="40" rx="3"/>
        <rect class="bar reveal in-bar" data-step="4" x="466" y="80" width="10" height="60" rx="3"/>
      </g>

      <circle class="stt-tick reveal" data-step="5" style="transition-delay:0s"   cx="370" cy="95" r="3"/>
      <circle class="stt-tick reveal" data-step="5" style="transition-delay:.35s" cx="450" cy="95" r="3"/>

      <g id="pause-2">
        <rect class="bar reveal silent-bar" data-step="6" x="480" y="107" width="8" height="6" rx="2"/>
        <rect class="bar reveal silent-bar" data-step="6" x="496" y="107" width="8" height="6" rx="2"/>
        <rect class="bar reveal silent-bar" data-step="6" x="512" y="107" width="8" height="6" rx="2"/>
        <rect class="bar reveal silent-bar" data-step="6" x="528" y="107" width="8" height="6" rx="2"/>
      </g>

      <line class="vad-marker reveal" data-step="6" x1="544" y1="80" x2="544" y2="140" stroke-width="4" stroke-linecap="round"/>
      <text class="tag-label reveal" data-step="6" x="552" y="112">VAD · 32ms</text>

      <rect class="grace-band reveal"      data-step="7" x="544" y="150" width="50"  height="14" rx="7"/>
      <rect class="grace-band full reveal" data-step="8" x="544" y="150" width="220" height="14" rx="7"/>

      <line class="reveal" data-step="8" x1="764" y1="145" x2="764" y2="350" stroke="var(--commit)" stroke-width="1.5"/>
      <text class="tag-label reveal" data-step="8" x="770" y="150" fill="var(--commit)">GATE OPENS</text>

      <!-- LANE 2: STT, continuous -->
      <text x="70" y="200" class="lane-label">STT · every 0.5s</text>
      <line x1="55" y1="246" x2="845" y2="246" stroke="var(--grid)" stroke-width="1"/>
      <circle class="pulse-dot reveal" data-step="1" cx="40" cy="230" r="7" fill="var(--audio-in)"/>
      <circle class="pulse-dot reveal" data-step="5" cx="40" cy="230" r="7" fill="var(--audio-in)"/>

      <text id="stt-line" x="70" y="236" font-size="18" fill="var(--fg)"
        ><tspan class="reveal" data-step="1">Turn off the lights</tspan
        ><tspan class="reveal" data-step="5" style="transition-delay:0s"> in</tspan
        ><tspan class="reveal" data-step="5" style="transition-delay:.4s"> the bedroom.</tspan
      ></text>

      <!-- LANE 3: LLM, speculative -->
      <text x="70" y="292" class="lane-label">LLM · SPECULATIVE</text>
      <line x1="55" y1="358" x2="845" y2="358" stroke="var(--grid)" stroke-width="1"/>
      <circle class="pulse-dot reveal" data-step="3" cx="40" cy="332" r="7" fill="var(--llm)"/>
      <circle class="pulse-dot reveal" data-step="7" cx="40" cy="332" r="7" fill="var(--llm)"/>

      <g id="chip-1">
        <text class="tag-label reveal" data-step="3" id="tag-1" x="290" y="308">SPECULATIVE</text>
        <rect class="reply-chip reveal" data-step="3" x="290" y="316" width="170" height="32" rx="8"/>
        <text class="reply-text reveal" data-step="3" x="300" y="337">Which lights?</text>
        <line class="strike reveal" data-step="5" x1="295" y1="332" x2="450" y2="332"/>
      </g>

      <g id="chip-2">
        <text class="tag-label reveal" data-step="7" id="tag-2" x="544" y="308">SPECULATIVE</text>
        <rect class="reply-chip reveal" data-step="7" x="544" y="316" width="200" height="32" rx="8"/>
        <text class="reply-text reply-text-2 reveal" data-step="7" x="554" y="337">Bedroom lights off.</text>
      </g>

      <!-- LANE 4: TTS out -->
      <text x="70" y="392" class="lane-label">TTS OUT</text>
      <line x1="55" y1="430" x2="845" y2="430" stroke="var(--grid)" stroke-width="1"/>
      <circle class="pulse-dot reveal" data-step="10" cx="40" cy="430" r="7" fill="var(--llm)"/>

      <g id="tts-bars">
        <rect class="bar reveal out-bar" data-step="10" x="70"  y="416" width="10" height="28" rx="3"/>
        <rect class="bar reveal out-bar" data-step="10" x="90"  y="408" width="10" height="44" rx="3"/>
        <rect class="bar reveal out-bar" data-step="10" x="110" y="400" width="10" height="60" rx="3"/>
        <rect class="bar reveal out-bar" data-step="10" x="130" y="412" width="10" height="36" rx="3"/>
        <rect class="bar reveal out-bar" data-step="10" x="150" y="404" width="10" height="52" rx="3"/>
        <rect class="bar reveal out-bar" data-step="10" x="170" y="418" width="10" height="24" rx="3"/>
        <rect class="bar reveal out-bar" data-step="10" x="190" y="410" width="10" height="40" rx="3"/>
      </g>

    </svg>
    <figcaption>Fires on the flimsiest signal it can. Only pays for it in wasted guesses, not in time.</figcaption>
  </figure>
</div>

<script>
  const steps = [
    { h: "You start speaking, and STT starts re-transcribing every half second", s: "Not gated by pauses — just a fixed clock, for as long as you're talking." },
    { h: "You pause — just 32ms of silence is enough", s: "A far shorter bar than a real pause needs to clear." },
    { h: "That's enough to fire a speculative reply", s: "Based on whatever's been said so far — which might not be the whole thought yet." },
    { h: "But you keep talking within the grace window", s: "The window was still open. That's allowed." },
    { h: "So the speculative reply is discarded — the transcript wasn't", s: "Only the guessed reply gets thrown away. Transcription just kept going the whole time." },
    { h: "A real pause — 32ms fires again", s: "" },
    { h: "A new speculative reply fires immediately", s: "This time based on the full sentence." },
    { h: "Nothing interrupts it — the window elapses clean", s: "A full second of silence, uninterrupted." },
    { h: "The gate opens — it was already sitting there, ready", s: "" },
    { h: "Speech starts almost immediately", s: "The wait was hidden inside the pause you were already sitting through." }
  ];

  let current = 1;
  const total = steps.length;

  const headlineEl = document.getElementById("headline");
  const subtextEl = document.getElementById("subtext");
  const dotsEl = document.getElementById("dots");
  const revealEls = document.querySelectorAll("[data-step]");
  const chip1 = document.querySelector("#chip-1 .reply-chip");
  const chip2 = document.querySelector("#chip-2 .reply-chip");
  const tag2 = document.getElementById("tag-2");

  for (let i = 1; i <= total; i++) {
    const dot = document.createElement("button");
    dot.className = "dot";
    dot.setAttribute("aria-label", "Go to step " + i);
    dot.addEventListener("click", () => { current = i; render(); });
    dotsEl.appendChild(dot);
  }
  const dotEls = dotsEl.querySelectorAll(".dot");

  function render() {
    headlineEl.textContent = steps[current - 1].h;
    subtextEl.textContent = steps[current - 1].s;

    revealEls.forEach(el => {
      el.classList.toggle("active", Number(el.dataset.step) <= current);
    });

    chip1.classList.toggle("discarded", current >= 5);
    chip2.classList.toggle("committed", current >= 9);
    tag2.textContent = current >= 9 ? "COMMITTED" : "SPECULATIVE";

    dotEls.forEach((d, i) => d.classList.toggle("on", i === current - 1));
  }

  document.getElementById("next").addEventListener("click", () => {
    current = current >= total ? 1 : current + 1;
    render();
  });
  document.getElementById("prev").addEventListener("click", () => {
    current = current <= 1 ? total : current - 1;
    render();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") document.getElementById("next").click();
    if (e.key === "ArrowLeft") document.getElementById("prev").click();
  });

  render();
</script>
